[package]
name = "split_view"
version = "0.1.0"
edition = "2021"

[dependencies]
egui = { workspace = true }
# Temporary pin until egui_dock releases egui 0.37 support:
# https://github.com/anhosh/egui_dock/pull/354
egui_dock = { git = "https://github.com/crumblingstatue/egui_dock", rev = "4bd1dcd90c7a71ed3bf38159f49a2992fa653c2c" }
eframe = { workspace = true }
log = { workspace = true }
egui_term = { path = "../../" }
winit = "0.30"
wgpu = { workspace = true }

# native:
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
env_logger = { workspace = true }

[features]
default = []
x11 = ["eframe/x11"]
wayland = ["eframe/wayland"]
